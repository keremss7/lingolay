name: ✨ Feature request
description: Suggest an idea for Lingolay
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to help implement this
