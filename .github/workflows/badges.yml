name: Badges

# shields.io's own GitHub "downloads" badge fails intermittently, so the total is computed here
# and the finished badge image is published on the `badges` branch. The README loads the SVG
# straight from GitHub, so a slow shields.io request can no longer turn it into a broken image.
on:
  schedule:
    - cron: "17 */6 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Count app downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[].assets[] | select(.name | test("^Lingolay-.*\\.zip$")) | .download_count] | add // 0' \
            | awk '{s += $1} END {print s + 0}')
          msg=$(python3 -c "n=$total; print(f'{n/1000:.1f}k'.replace('.0k', 'k') if n >= 1000 else str(n))")
          mkdir -p out
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"30cc74"}\n' "$msg" > out/downloads.json
          cat out/downloads.json
          curl -fsS --retry 5 --retry-all-errors --max-time 20 -o out/downloads.svg \
            "https://img.shields.io/badge/downloads-${msg}-30cc74"
          grep -q '<svg' out/downloads.svg
      - name: Publish to the badges branch
        run: |
          cd out
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json downloads.svg
          git commit -q -m "Update download badge"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
