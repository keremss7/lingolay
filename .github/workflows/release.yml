name: Release

# Push a tag like v2.0.0 to build the Windows app and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[all]" pyinstaller
      - name: Build
        run: pyinstaller packaging/lingolay.spec --noconfirm --clean
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/Lingolay/Lingolay.exe -ArgumentList "--version" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Lingolay/* -DestinationPath "Lingolay-${{ github.ref_name }}-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Lingolay-*-windows-x64.zip
          generate_release_notes: true
          body_path: .github/RELEASE_NOTES.md
